name: Build and Publish Flatpak Repo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'  # every day at 04:00 UTC
    - cron: '0 16 * * *' # every day at 16:00 UTC

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flatpak and Flatpak Builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: |
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install required runtimes
        run: |
          source ./config.sh
          flatpak --user install -y flathub org.freedesktop.Platform//$RUNTIME_VERSION org.freedesktop.Sdk//$RUNTIME_VERSION

      - name: Build Flatpak and repo
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Commit version bump to keep the schedule alive
        run: |
          if [ ! -f LATEST_VERSION ]; then
            echo "build.sh did not produce LATEST_VERSION; skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LATEST_VERSION
          if git diff --staged --quiet; then
            echo "No new Nightly build since last run; nothing to commit."
          else
            git commit -m "Update Nightly to $(cat LATEST_VERSION) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload Flatpak repo as artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
